name: BedWars1058-EasySetup
version: ${version}
main: dev.etran.EasySetupPlugin
# api-version 1.13 stops 1.13+ servers treating this as a legacy plugin; servers before 1.13 ignore the key.
api-version: '1.13'
description: Manual, semi-automatic and fully automatic Bedwars1058 arena setup.
authors: [thelittlebotengineer]
depend: [BedWars1058]

commands:
  bwsetup:
    description: Start hotbar setup mode and open the setup menu.
    usage: /bwsetup [open|exit|tools|page <team|map>|mode|gamemode|facing|snap|pitch|import|status|reset]
    aliases: [bwa, bwautosetup]
    permission: bwauto.use
  bwauto:
    description: Run automatic placement, or confirm/deny it when elements are missing.
    usage: /bwauto [run|next|confirm|deny|gens]
    permission: bwauto.use
  nextgen:
    description: Detect and place the next diamond/emerald generator, or rotate around the map centre.
    usage: /nextgen [diamond|emerald] [degrees]
    aliases: [bwrotate]
    permission: bwauto.use

permissions:
  bwauto.use:
    description: Use the Bedwars auto-setup tools.
    default: op
